import { useState, useEffect } from "react";

const initialGrid = [
  ["road", "polise", "road"],
  ["grass", "car2", "road"],
  ["car1", "road", "road"]
];

function App() {
  const [grid, setGrid] = useState(initialGrid);
  const [carPos, setCarPos] = useState([1, 1]);

  const moveCar = () => {
    const [row, col] = carPos;
    if (col < 2) {
      const newGrid = grid.map((r) => r.slice());
      newGrid[row][col] = "road";
      newGrid[row][col + 1] = "car";
      setGrid(newGrid);
      setCarPos([row, col + 1]);
    }
  };

  return (
    <div className="p-4">
      <RoadGrid grid={grid} />
      <button className="mt-4 p-2 bg-blue-500 text-white" onClick={moveCar}>
        Рухатись вправо →
      </button>
    </div>
  );
}

export default App;
🔹 3. Чи є готові рішення?
Так, але зазвичай вони:
або надто складні (на зразок симуляцій Unity / Three.js);

або орієнтовані не на ПДР, а на фізику/трафік.

Тому найкращий варіант — зробити свій мінімальний engine на React з контролем:

матриці дороги,

машинок і їхніх позицій,

станів (рухається / чекає / аварія тощо),

правил пріоритету (згодом).

🔹 4. Чи підходить використання матриці?
Так, це хороше рішення, бо:
дозволяє зручно працювати з позиціями машинок (координати);

просто оновлювати рух;

легко масштабувати до більш складних перехресть.

Альтернативи:

використання Canvas / SVG — краще для графічної деталізації, але важче керувати логікою.

фізичні движки (matter.js, p2.js) — занадто складно на старті.

🔹 5. Що робити далі?
Після мінімального прототипу:

Додати кнопки "Повернути ліворуч/праворуч/прямо".

Додати індикатори напрямку.

Додати правила ПДР (пріоритет, стоп, світлофор).

Зробити таймер і "аварію", якщо хтось порушує.

Додати кількох учасників дорожнього руху.

