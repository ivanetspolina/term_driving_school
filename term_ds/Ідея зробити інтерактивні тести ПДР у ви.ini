export default function RoadGrid({ grid }) {
  return (
    <div className="grid grid-cols-3 gap-1 w-fit border">
      {grid.map((row, rowIndex) =>
        row.map((cell, colIndex) => (
          <div
            key={`${rowIndex}-${colIndex}`}
            className={`w-20 h-20 flex items-center justify-center border
                        ${cell === 'road' ? 'bg-gray-300' : 'bg-green-200'}
                        ${cell === 'car' ? 'bg-blue-400' : ''}`}
          >
            {cell === 'car' && '🚗'}
          </div>
        ))
      )}
    </div>
  );
}
